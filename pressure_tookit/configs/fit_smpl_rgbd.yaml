# Flags for data set and data dirs
dataset: '20260804'
# basdir 指向 adapter 构建的上游原生目录契约（model_inputs/pressure_toolkit/v1）
basdir: 'model-input://pressure_toolkit/v1'
sub_ids: 'S7'
# init_data_dir 指向 work 运行根：
#   <init_data_dir>/fitting/results/<date>/<subject>/init_shape_<subject>.npz
#   <init_data_dir>/initialization/<date>/<subject>/<session>/<session>_cliff_hr48.npz
init_data_dir: 'work://pressure_toolkit/fitting'
seq_name: 'S7012'
essential_root: 'asset://third_party/pressure_toolkit/essential'
output_dir: 'work://pressure_toolkit/fitting/fitting'
# DepthPro depth frames are native 1624x1240. The depth canvas stays at the
# upstream 640x576: fit_single_frame scales the native intrinsics to the
# canvas, and the depth loss compares 3D points, so the smaller canvas costs
# less per iteration without changing the fitting math.
color_size:
  - 1624
  - 1240
depth_size:
  - 640
  - 576

model_gender: 'male' # teenager is male, others follow facts

fitting_stage: 'init_shape' # init_shape, init_pose, tracking

start_idx: 0
end_idx: 1  # [)
maxiters: 101
